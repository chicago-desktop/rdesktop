version: "1.0"
namespace: chicago.rdesktop

# Remote Desktop for the Chicago shell: a window that shows another desktop
# and drives it — its rows on this screen, this keyboard and mouse on it.
#
# The window reaches the other desktop only through a session interface
# (open, channels, notice, snapshot, send, resize, close; loopback.lua says
# what each one does). This version has one transport, the loopback — the
# "remote" desktop is a Chicago shell in a local tty viewport on this node.
# A network transport implements the same interface; the window switches
# to it by its `transport:` import alone.
#
# Keep the comments of this file free of an unquoted `: ` — a colon followed
# by a space inside a meta.comment or a YAML comment value breaks the parse
# of the whole index, and the boot with it. Quote such comments.

entries:
  - name: definition
    kind: ns.definition
    meta:
      title: Remote Desktop
      description: A window that shows another Chicago desktop and drives it; the loopback transport runs that desktop on this node.

  # ─── Dependencies ────────────────────────────────────────────────────
  - version: ">=0.2.0"
    name: dep.chicago.shell
    kind: ns.dependency
    meta:
      comment: The Chicago shell — the desktop the loopback session starts, and its security policies.
    component: github.com/chicago-desktop/shell

  - version: ">=0.2.0"
    name: dep.chicago.tui_desktop
    kind: ns.dependency
    meta:
      comment: The desktop base — the compositor that owns the window's frame, size and input, its input normalizer and its window host.
    component: github.com/chicago-desktop/tui-desktop

  # chicago.rdesktop:frames
  - name: frames
    kind: library.lua
    meta:
      comment: "The remote screen as row deltas — what changed since the previous delta, applying a delta to the window's copy, the rows at the window's size; pure."
    source: file://frames.lua

  # chicago.rdesktop:inputs
  - name: inputs
    kind: library.lua
    meta:
      comment: "What the viewer forwards — the key mode that maps the combinations the local compositor takes (Alt+Page Up for Alt+Tab, Ctrl+Alt+End for Ctrl+Q …) and mouse coordinates pinned to the remote screen; pure."
    source: file://inputs.lua
    imports:
      input: chicago.tui_desktop.desktop:input

  # chicago.rdesktop:loopback
  #
  # The loopback transport: a local tty viewport, the desktop spawned into
  # it with the viewport's grant, row deltas computed from its snapshots.
  - name: loopback
    kind: library.lua
    meta:
      comment: The loopback transport of a remote-desktop session — the remote desktop in a local tty viewport on this node.
    source: file://loopback.lua
    modules: [tty, process]
    imports:
      frames: chicago.rdesktop:frames

  # chicago.rdesktop:session_spawn
  #
  # What the window itself needs to run the loopback session: start the
  # desktop on the base's window host with the viewport's grant, watch it,
  # and cancel it when the window closes.
  - name: session_spawn
    kind: security.policy
    meta:
      comment: Start the loopback desktop on the window host, monitor it and cancel it on close.
    policy:
      actions:
        - process.context
        - process.spawn
        - process.spawn.monitored
        - process.monitor
        - process.host
        - process.terminate
      resources: "*"
      effect: allow

  # chicago.rdesktop:window
  #
  # A cells window (no pixel_render): the remote desktop arrives as styled
  # terminal rows. The desktop it starts runs under this window's identity,
  # so the window carries the shell's own two policies besides its own — the
  # loopback desktop is a shell, and a shell without them does not come up.
  # The desktop it starts is fixed in window.lua, never taken from args.
  - name: window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Remote Desktop
      image: dialup
      icon: "▣"
      group: Programs/Accessories
      order: 100
      width: 84
      height: 28
      window_type: app
      resizable: true
      comment: "Remote Desktop — another Chicago desktop in a window (loopback transport, a shell on this node); keys mapped for the combinations the local desktop takes."
    source: file://window.lua
    method: main
    modules: [tty, json, channel]
    imports:
      transport: chicago.rdesktop:loopback
      frames: chicago.rdesktop:frames
      inputs: chicago.rdesktop:inputs
      input: chicago.tui_desktop.desktop:input
    security:
      policies:
        - chicago.rdesktop:session_spawn
        - chicago.shell.security:shell_runtime
        - chicago.shell.security:shell_env

  # chicago.rdesktop:tip
  - name: tip
    kind: registry.entry
    meta:
      type: chicago.tip
      order: 500
      comment: "Welcome tip — Remote Desktop and its key combinations; Show Me opens it."
    data:
      text: "Remote Desktop shows another desktop in a window. The keys your own desktop keeps reach it differently - Alt+Page Up switches its windows, Alt+Home opens its Start menu, Ctrl+Alt+End shuts it down."
      image: dialup
      open: chicago.rdesktop:window
