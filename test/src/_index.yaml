version: "1.0"
namespace: app

# Standalone harness for chicago/rdesktop. Provides the host resources
# the boot needs (app:db, app:processes, a gateway and a router for the
# shell's endpoints, env storage, a permissive actor scope) and runs the
# co-located *_test.lua suites. Excluded from publish by the module's
# wippy.yaml.
#
# Every test entry is a function.lua with `meta.type: test`; `wippy test`
# runs the ones it discovers. A test file must be in the run_cases form
# (see frames_test.lua) — the other form is counted, printed green and never
# executed.

entries:
  - name: definition
    kind: ns.definition
    meta: {title: Remote Desktop Test Harness}

  - name: frames_test
    kind: function.lua
    meta:
      type: test
      comment: "Row deltas — the first delta is full, then only changed rows, a size change is full again; applying them; the rows at the window's size with a notice."
      group: Remote Desktop
      suite: chicago_rdesktop
    source: file://frames_test.lua
    method: run
    imports:
      test: wippy.test:test
      frames: chicago.rdesktop:frames

  - name: inputs_test
    kind: function.lua
    meta:
      type: test
      comment: "The key modes — the combinations the local compositor takes arrive mapped in the remote mode and unchanged in the local one; mouse coordinates pinned to the remote screen."
      group: Remote Desktop
      suite: chicago_rdesktop
    source: file://inputs_test.lua
    method: run
    imports:
      test: wippy.test:test
      inputs: chicago.rdesktop:inputs

  - name: loopback_test
    kind: function.lua
    meta:
      type: test
      comment: "The loopback transport end to end — a producer in a local viewport through open, snapshot deltas, send, resize and close, and the Chicago shell itself coming up in one on the base's window host."
      group: Remote Desktop
      suite: chicago_rdesktop
    source: file://loopback_test.lua
    method: run
    modules: [channel, time, process, fs]
    imports:
      test: wippy.test:test
      loopback: chicago.rdesktop:loopback
      inputs: chicago.rdesktop:inputs
      frames: chicago.rdesktop:frames

  - name: window_test
    kind: function.lua
    meta:
      type: test
      comment: "The two windows' entries — the connection window on the SDK with the shell's renderer, the session window in cells outside the menu on the mesh; their args."
      group: Remote Desktop
      suite: chicago_rdesktop
    source: file://window_test.lua
    method: run
    modules: [registry]
    imports:
      test: wippy.test:test
      window: chicago.rdesktop:window
      session: chicago.rdesktop:session

  - name: window_run_test
    kind: function.lua
    meta:
      type: test
      comment: "The two windows run as the compositor runs them after a logon — own viewport, a person's actor, a narrow scope; the connection screen in cells opens the session window, the session drives the remote desktop and hands an end or a refusal back with the reason."
      group: Remote Desktop
      suite: chicago_rdesktop
    source: file://window_run_test.lua
    method: run
    modules: [tty, channel, time, process, security, fs, system, json]
    imports:
      test: wippy.test:test

  # app:narrow — the scope a logged-on person's window gets in the test
  # above; what a view window carries (chicago.shell.security:view_state),
  # nothing more. The window must bring the rest with its own entry.
  - name: narrow
    kind: security.policy
    meta:
      comment: A narrow person's scope for window_run_test.
    policy:
      actions:
        - process.context
        - process.registry
        - process.send
      resources: "*"
      effect: allow

  - name: connect_test
    kind: function.lua
    meta:
      type: test
      comment: "The Remote Desktop Connection screen as data — the network from a stand-in membership read through the shell's facts, only known columns, the SDK layout, what each action does."
      group: Remote Desktop
      suite: chicago_rdesktop
    source: file://connect_test.lua
    method: run
    modules: [tty]
    imports:
      test: wippy.test:test
      connect: chicago.rdesktop:connect
      facts: chicago.shell.config:system
      ui: chicago.shell.sdk:ui
      cells: chicago.shell.sdk:cells

  - name: connect_window_test
    kind: function.lua
    meta:
      type: test
      comment: "Remote Desktop Connection through the SDK — Connect opens the session window and goes, Cancel and Esc close, the reason comes back, args connect at once, and test/shots/connect.png drawn by the shell's renderer."
      group: Remote Desktop
      suite: chicago_rdesktop
    source: file://connect_window_test.lua
    method: run
    modules: [process, channel, time, json, fs, gfx, tty]
    imports:
      test: wippy.test:test
      app: chicago.shell.sdk:app
      ui: chicago.shell.sdk:ui
      render: chicago.shell.sdk:render
      rasters: chicago.shell.theme:rasters
      window: chicago.rdesktop:window

  - name: session_window_test
    kind: function.lua
    meta:
      type: test
      comment: "The session window through the SDK against this node's broker — the remote screen in mono columns with pixels, keys forwarded, a resize in mono columns, and test/shots/session.png drawn by the shell's renderer."
      group: Remote Desktop
      suite: chicago_rdesktop
    source: file://session_window_test.lua
    method: run
    modules: [channel, time, fs, gfx, tty, process]
    imports:
      test: wippy.test:test
      app: chicago.shell.sdk:app
      ui: chicago.shell.sdk:ui
      render: chicago.shell.sdk:render
      rasters: chicago.shell.theme:rasters
      session: chicago.rdesktop:session
      mesh: chicago.rdesktop:mesh
      frames: chicago.rdesktop:frames

  - name: wire_test
    kind: function.lua
    meta:
      type: test
      comment: "The session protocol's tables — changed rows keyed by zero-based string index, the zero-based cursor, only shapes that survive the hop between nodes, broker names and nodes from PIDs."
      group: Remote Desktop
      suite: chicago_rdesktop
    source: file://wire_test.lua
    method: run
    imports:
      test: wippy.test:test
      wire: chicago.rdesktop:wire
      frames: chicago.rdesktop:frames

  - name: mesh_test
    kind: function.lua
    meta:
      type: test
      comment: "The mesh transport on one node — a broker and its sessions, deltas, input, resize, one frame in flight, resync, the viewer or the server gone, and this node's broker service serving the Chicago desktop."
      group: Remote Desktop
      suite: chicago_rdesktop
    source: file://mesh_test.lua
    method: run
    modules: [channel, time, process, fs, security]
    imports:
      test: wippy.test:test
      mesh: chicago.rdesktop:mesh
      exits: chicago.rdesktop:exits
      inputs: chicago.rdesktop:inputs
      frames: chicago.rdesktop:frames

  # app:link_probe / app:crasher — a watcher of a linked child that fails
  # (mesh_test): the LINK_DOWN a node's departure sends to monitors too.
  - name: link_probe
    kind: process.lua
    meta:
      comment: Watches a linked child that fails and reports what it was told.
    source: file://link_probe.lua
    method: main
    modules: [process]
    imports:
      exits: chicago.rdesktop:exits

  - name: crasher
    kind: process.lua
    meta:
      comment: Fails on request.
    source: file://crasher.lua
    method: main
    modules: [process]

  # app:painter — a producer with a picture on its screen (mesh_test).
  - name: painter
    kind: process.lua
    meta:
      comment: A tty producer that puts a picture on its screen and moves or replaces it on keys.
    source: file://painter.lua
    method: main
    modules: [tty, gfx, process, channel]

  # app:stubborn — a producer that does not act on CANCEL (mesh_test).
  - name: stubborn
    kind: process.lua
    meta:
      comment: A tty producer that ignores CANCEL; only a terminate ends it.
    source: file://stubborn.lua
    method: main
    modules: [tty, process]

  # app:viewer_probe — a viewer that vanishes without closing (mesh_test).
  - name: viewer_probe
    kind: process.lua
    meta:
      comment: A mesh viewer for mesh_test that exits without closing its session.
    source: file://viewer_probe.lua
    method: main
    modules: [process]
    imports:
      mesh: chicago.rdesktop:mesh

  # app:echo — a producer for loopback_test: draws its size and the last
  # input it got, and exits on close or cancel.
  - name: echo
    kind: process.lua
    meta:
      comment: A tty producer for the loopback test — its size and the last input on two rows.
    source: file://echo.lua
    method: main
    modules: [tty, process, channel]

  - name: system_fonts
    kind: fs.directory
    meta:
      comment: System TrueType fonts, read-only — the font arrives in gfx as bytes, not as a path.
    auto_init: false
    directory: /usr/share/fonts/truetype/liberation/

  - name: shots
    kind: fs.directory
    meta:
      comment: Where the tests write what they saw — screens as text, the connection window as a PNG.
    base: project
    directory: ./shots
    auto_init: true

  - name: db
    kind: db.sql.sqlite
    meta:
      comment: In-memory database — the sample does not use it, but the shell's migrations ask for the resource.
    file: ":memory:"

  # The environment: fixed values first, then the file. CHICAGO_PIXELS is
  # what the application sets too: a served desktop told it has graphics
  # (view:terminal) comes up in pixels only when it is also asked to. A
  # desktop on a port without graphics stays in cells regardless.
  - name: env_storage
    kind: env.storage.router
    meta:
      type: envstorage
    storages:
      - app:env_fixed
      - app:env_file

  - name: env_fixed
    kind: env.storage.static
    meta:
      comment: The values the application sets for the shell.
    values:
      CHICAGO_PIXELS: "1"

  - name: env_file
    kind: env.storage.file
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  # The shell's endpoint entries resolve against these at boot; no suite calls
  # them. The port is apart from the shell harness's :19229 and the other
  # modules' harnesses (19239, 19250-19254), so they can run side by side.
  - name: gateway
    kind: http.service
    addr: :19260
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      server: gateway
    prefix: /api

  - name: user
    kind: security.policy
    meta:
      comment: Permissive actor scope for the suites.
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  # The harness tests the module, so it depends on it; the replacement in
  # .wippy.yaml substitutes the working copy from ../.
  - name: rdesktop_harness.dep.module
    version: "*"
    kind: ns.dependency
    meta:
      comment: The module under test; its source is replaced with ../ in .wippy.yaml.
    component: "chicago/rdesktop"

  - name: rdesktop_harness.dep.migration
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host binding for the migrations the shell brings.
    component: "wippy/migration"
    parameters:
      - name: wippy.migration:app_db
        value: app:db

  - name: rdesktop_harness.dep.security
    version: "*"
    kind: ns.dependency
    meta:
      comment: Platform security groups that give host-managed services their policy scope under strict mode.
    component: "wippy/security"

  - name: rdesktop_harness.dep.bootloader
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host wiring for the standalone test harness.
    component: "wippy/bootloader"
    parameters:
      - name: wippy.bootloader:application_host
        value: app:processes
      - name: wippy.bootloader:env_storage
        value: app:env_storage
