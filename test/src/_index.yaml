version: "1.0"
namespace: app

# Standalone harness for chicago/rdesktop. Provides the host resources
# the boot needs (app:db, app:processes, a gateway and a router for the
# shell's endpoints, env storage, a permissive actor scope) and runs the
# co-located *_test.lua suites. Excluded from publish by the module's
# wippy.yaml.
#
# Every test entry is a function.lua with `meta.type: test`; `wippy test`
# runs the ones it discovers. A test file must be in the run_cases form
# (see frames_test.lua) — the other form is counted, printed green and never
# executed.

entries:
  - name: definition
    kind: ns.definition
    meta: {title: Remote Desktop Test Harness}

  - name: frames_test
    kind: function.lua
    meta:
      type: test
      comment: "Row deltas — the first delta is full, then only changed rows, a size change is full again; applying them; the rows at the window's size with a notice."
      group: Remote Desktop
      suite: chicago_rdesktop
    source: file://frames_test.lua
    method: run
    imports:
      test: wippy.test:test
      frames: chicago.rdesktop:frames

  - name: inputs_test
    kind: function.lua
    meta:
      type: test
      comment: "The key modes — the combinations the local compositor takes arrive mapped in the remote mode and unchanged in the local one; mouse coordinates pinned to the remote screen."
      group: Remote Desktop
      suite: chicago_rdesktop
    source: file://inputs_test.lua
    method: run
    imports:
      test: wippy.test:test
      inputs: chicago.rdesktop:inputs

  - name: loopback_test
    kind: function.lua
    meta:
      type: test
      comment: "The loopback transport end to end — a producer in a local viewport through open, snapshot deltas, send, resize and close, and the Chicago shell itself coming up in one on the base's window host."
      group: Remote Desktop
      suite: chicago_rdesktop
    source: file://loopback_test.lua
    method: run
    modules: [channel, time, process, fs]
    imports:
      test: wippy.test:test
      loopback: chicago.rdesktop:loopback
      inputs: chicago.rdesktop:inputs
      frames: chicago.rdesktop:frames

  - name: window_test
    kind: function.lua
    meta:
      type: test
      comment: "The window's registry entry — a cells window in Programs/Accessories whose transport is the one import, with the policies the loopback desktop needs; its args parsing."
      group: Remote Desktop
      suite: chicago_rdesktop
    source: file://window_test.lua
    method: run
    modules: [registry]
    imports:
      test: wippy.test:test
      window: chicago.rdesktop:window

  - name: window_run_test
    kind: function.lua
    meta:
      type: test
      comment: "The window run as the compositor runs it after a logon — its own viewport, a person's actor, a narrow scope; the remote desktop comes up in it, Alt+Home reaches it, close ends it."
      group: Remote Desktop
      suite: chicago_rdesktop
    source: file://window_run_test.lua
    method: run
    modules: [tty, channel, time, process, security, fs]
    imports:
      test: wippy.test:test

  # app:narrow — the scope a logged-on person's window gets in the test
  # above; what a view window carries (chicago.shell.security:view_state),
  # nothing more. The window must bring the rest with its own entry.
  - name: narrow
    kind: security.policy
    meta:
      comment: A narrow person's scope for window_run_test.
    policy:
      actions:
        - process.context
        - process.registry
        - process.send
      resources: "*"
      effect: allow

  # app:echo — a producer for loopback_test: draws its size and the last
  # input it got, and exits on close or cancel.
  - name: echo
    kind: process.lua
    meta:
      comment: A tty producer for the loopback test — its size and the last input on two rows.
    source: file://echo.lua
    method: main
    modules: [tty, process, channel]

  - name: shots
    kind: fs.directory
    meta:
      comment: Where loopback_test writes the screens it saw, as text.
    base: project
    directory: ./shots
    auto_init: true

  - name: db
    kind: db.sql.sqlite
    meta:
      comment: In-memory database — the sample does not use it, but the shell's migrations ask for the resource.
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  # The shell's endpoint entries resolve against these at boot; no suite calls
  # them. The port is apart from the shell harness's :19229 and the other
  # modules' harnesses (19239, 19250-19254), so they can run side by side.
  - name: gateway
    kind: http.service
    addr: :19260
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      server: gateway
    prefix: /api

  - name: user
    kind: security.policy
    meta:
      comment: Permissive actor scope for the suites.
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  # The harness tests the module, so it depends on it; the replacement in
  # .wippy.yaml substitutes the working copy from ../.
  - name: rdesktop_harness.dep.module
    version: "*"
    kind: ns.dependency
    meta:
      comment: The module under test; its source is replaced with ../ in .wippy.yaml.
    component: "chicago/rdesktop"

  - name: rdesktop_harness.dep.migration
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host binding for the migrations the shell brings.
    component: "wippy/migration"
    parameters:
      - name: wippy.migration:app_db
        value: app:db

  - name: rdesktop_harness.dep.security
    version: "*"
    kind: ns.dependency
    meta:
      comment: Platform security groups that give host-managed services their policy scope under strict mode.
    component: "wippy/security"

  - name: rdesktop_harness.dep.bootloader
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host wiring for the standalone test harness.
    component: "wippy/bootloader"
    parameters:
      - name: wippy.bootloader:application_host
        value: app:processes
      - name: wippy.bootloader:env_storage
        value: app:env_storage
