version: "1.0"
namespace: app

# Standalone harness for chicago/rdesktop. Provides the host resources
# the boot needs (app:db, app:processes, a gateway and a router for the
# shell's endpoints, env storage, a permissive actor scope) and runs the
# co-located *_test.lua suites. Excluded from publish by the module's
# wippy.yaml.
#
# Every test entry is a function.lua with `meta.type: test`; `wippy test`
# runs the ones it discovers. A test file must be in the run_cases form
# (see view_test.lua) — the other form is counted, printed green and never
# executed.

entries:
  - name: definition
    kind: ns.definition
    meta: {title: Remote Desktop Test Harness}

  - name: view_test
    kind: function.lua
    meta:
      type: test
      comment: "The sample window as data — the initial tree, the click count, Exit, About, the layout in cells, and test/shots/hello.png drawn by the shell's renderer."
      group: Remote Desktop
      suite: chicago_rdesktop
    source: file://view_test.lua
    method: run
    # `gfx` and `fs` for the shot: the font arrives as bytes read from
    # app:system_fonts, the PNG is written to app:shots.
    modules: [tty, gfx, fs]
    imports:
      test: wippy.test:test
      ui: chicago.shell.sdk:ui
      app: chicago.shell.sdk:app
      render: chicago.shell.sdk:render
      rasters: chicago.shell.theme:rasters
      view: chicago.rdesktop:view

  - name: window_test
    kind: function.lua
    meta:
      type: test
      comment: "The sample window's process — the registry entry the Start menu reads, the pack's picture found by the shell, and the process running the view."
      group: Remote Desktop
      suite: chicago_rdesktop
    source: file://window_test.lua
    method: run
    # Reading a pack takes `registry.get` as well as `fs.get`, and `gfx` to
    # decode the picture.
    modules: [gfx, fs, registry]
    imports:
      test: wippy.test:test
      app: chicago.shell.sdk:app
      images: chicago.shell.theme:images
      view: chicago.rdesktop:view
      window: chicago.rdesktop:window

  - name: tip_test
    kind: function.lua
    meta:
      type: test
      comment: "The module's tip for the Welcome window — a chicago.tip entry the window finds, its text, its picture in the pack at 32 px, the window Show Me opens."
      group: Remote Desktop
      suite: chicago_rdesktop
    source: file://tip_test.lua
    method: run
    # `registry.find` is the Welcome window's own query; reading the pack
    # takes `fs` and `gfx`, as in window_test.
    modules: [registry, gfx, fs]
    imports:
      test: wippy.test:test
      images: chicago.shell.theme:images
      view: chicago.rdesktop:view

  - name: shots
    kind: fs.directory
    meta:
      comment: Where the window's shot goes.
    base: project
    directory: ./shots
    auto_init: true

  - name: system_fonts
    kind: fs.directory
    meta:
      comment: System TrueType fonts, read-only — the font arrives in gfx as bytes, not as a path.
    auto_init: false
    directory: /usr/share/fonts/truetype/liberation/

  - name: db
    kind: db.sql.sqlite
    meta:
      comment: In-memory database — the sample does not use it, but the shell's migrations ask for the resource.
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  # The shell's endpoint entries resolve against these at boot; no suite calls
  # them. The port is apart from the shell harness's :19229 and the other
  # modules' harnesses, so they can run side by side.
  - name: gateway
    kind: http.service
    addr: :19239
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      server: gateway
    prefix: /api

  - name: user
    kind: security.policy
    meta:
      comment: Permissive actor scope for the suites.
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  # The harness tests the module, so it depends on it; the replacement in
  # .wippy.yaml substitutes the working copy from ../.
  - name: rdesktop_harness.dep.module
    version: "*"
    kind: ns.dependency
    meta:
      comment: The module under test; its source is replaced with ../ in .wippy.yaml.
    component: "chicago/rdesktop"

  - name: rdesktop_harness.dep.migration
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host binding for the migrations the shell brings.
    component: "wippy/migration"
    parameters:
      - name: wippy.migration:app_db
        value: app:db

  - name: rdesktop_harness.dep.security
    version: "*"
    kind: ns.dependency
    meta:
      comment: Platform security groups that give host-managed services their policy scope under strict mode.
    component: "wippy/security"

  - name: rdesktop_harness.dep.bootloader
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host wiring for the standalone test harness.
    component: "wippy/bootloader"
    parameters:
      - name: wippy.bootloader:application_host
        value: app:processes
      - name: wippy.bootloader:env_storage
        value: app:env_storage
