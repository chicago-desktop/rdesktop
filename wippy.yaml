organization: chicago
module: rdesktop
description: Remote Desktop for the Chicago desktop — a window that shows another Chicago desktop and drives it, behind a session interface a network transport can implement; the loopback transport runs that desktop on this node.
license: MIT
repository: https://github.com/chicago-desktop/rdesktop
homepage: https://wippy.ai
keywords:
  - kickside
  - tui
  - terminal
  - desktop
  - chicago
# No `version:` here — the publisher picks it (`wippy publish` bumps the
# latest published one). A published version is immutable.
exclude_meta:
  type:
    - test
exclude:
  - "wippy.lock"
  - "app:**"
  - "app.env:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
# `wippy publish` packs the entries of src/ and embeds only the fs.directory
# entries named here. The module declares none: its picture is the shell's
# catalog icon `dialup`.
